name: Check TestFlight Groups
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Manage TestFlight builds
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          BUNDLE_ID: app.bourbonconnect.mobile
        run: |
          set -euo pipefail
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$ASC_PRIVATE_KEY" > /tmp/AuthKey.p8
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 -d > /tmp/AuthKey.p8
          fi
          python3 -m pip install -q --break-system-packages pyjwt cryptography 2>&1 | tail -1 || true
          python3 - <<'PYEOF'
          import json, time, urllib.request, urllib.error, os
          import jwt
          kid = os.environ["ASC_KEY_ID"]; iss = os.environ["ASC_ISSUER_ID"]
          now = int(time.time())
          with open("/tmp/AuthKey.p8") as f:
              key = f.read()
          token = jwt.encode(
              {"iss": iss, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"},
          )
          def api(path: str, method="GET", body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com{path}",
                  data=data, method=method,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.load(r) if r.status != 204 else {}
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:800].decode(errors="replace")
          bundle = os.environ["BUNDLE_ID"]
          _, apps = api(f"/v1/apps?filter[bundleId]={bundle}")
          app = apps["data"][0]; aid = app["id"]
          print(f"App: {app['attributes'].get('name')} id={aid}")
          _, builds = api(f"/v1/builds?filter[app]={aid}&sort=-uploadedDate&limit=8&fields[builds]=version,uploadedDate,processingState")
          all_builds = builds.get("data", [])
          for b in all_builds:
              a = b["attributes"]
              print(f"  build id={b['id']} version={a.get('version')} uploaded={a.get('uploadedDate')} state={a.get('processingState')}")
          _, groups = api(f"/v1/apps/{aid}/betaGroups?fields[betaGroups]=name,isInternalGroup")
          internal_gid = None
          for g in groups.get("data", []):
              ga = g["attributes"]
              print(f"Group: {ga.get('name')} internal={ga.get('isInternalGroup')} id={g['id']}")
              if ga.get("isInternalGroup"):
                  internal_gid = g["id"]
          if not internal_gid:
              print("No internal group found"); raise SystemExit(1)
          _, gb = api(f"/v1/betaGroups/{internal_gid}/builds?fields[builds]=version&limit=20")
          in_group = {b["attributes"].get("version") for b in gb.get("data", [])}
          print(f"Builds currently in internal group: {sorted(in_group)}")
          # Add latest VALID build not yet in the group
          for b in all_builds:
              ver = b["attributes"].get("version")
              state = b["attributes"].get("processingState")
              if state == "VALID" and ver not in in_group:
                  s, resp = api(f"/v1/betaGroups/{internal_gid}/relationships/builds",
                                method="POST", body={"data": [{"type": "builds", "id": b["id"]}]})
                  print(f"Added build version={ver} to internal group: status={s} resp={str(resp)[:300]}")
                  in_group.add(ver)
          print("Done.")
          PYEOF
