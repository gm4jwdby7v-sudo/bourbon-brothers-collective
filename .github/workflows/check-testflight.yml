name: Check TestFlight Groups
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Query beta groups and testers
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          BUNDLE_ID: app.bourbonconnect.mobile
        run: |
          set -euo pipefail
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$ASC_PRIVATE_KEY" > /tmp/AuthKey.p8
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 -d > /tmp/AuthKey.p8
          fi
          python3 - <<'PYEOF'
          import base64, json, time, urllib.request, subprocess, os
          def b64url(b: bytes) -> str:
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          kid = os.environ["ASC_KEY_ID"]; iss = os.environ["ASC_ISSUER_ID"]
          now = int(time.time())
          header = b64url(json.dumps({"alg":"ES256","kid":kid,"typ":"JWT"}).encode())
          payload = b64url(json.dumps({"iss":iss,"iat":now,"exp":now+1200,"aud":"appstoreconnect-v1"}).encode())
          si = f"{header}.{payload}".encode()
          der = subprocess.run(["openssl","dgst","-sha256","-sign","/tmp/AuthKey.p8"], input=si, capture_output=True, check=True).stdout
          def der_to_raw(der: bytes) -> bytes:
              idx = 2
              if der[1] & 0x80: idx = 2 + (der[1] & 0x7F)
              idx += 2; ln = der[idx]; idx += 1; r = der[idx:idx+ln]; idx += ln
              idx += 2; ln = der[idx]; idx += 1; s = der[idx:idx+ln]
              return r.rjust(32,b"\0")[-32:] + s.rjust(32,b"\0")[-32:]
          token = f"{header}.{payload}.{b64url(der_to_raw(der))}"
          def api(path: str):
              req = urllib.request.Request(f"https://api.appstoreconnect.apple.com{path}", headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req) as r: return json.load(r)
          bundle = os.environ["BUNDLE_ID"]
          app = api(f"/v1/apps?filter[bundleId]={bundle}")["data"][0]
          aid = app["id"]
          print(f"App id: {aid}")
          groups = api(f"/v1/apps/{aid}/betaGroups?fields[betaGroups]=name,isInternalGroup,publicLinkEnabled")
          for g in groups["data"]:
              ga = g["attributes"]
              print(f"\nGroup: {ga['name']} internal={ga['isInternalGroup']} publicLink={ga.get('publicLinkEnabled')}")
              builds = api(f"/v1/betaGroups/{g['id']}/builds?fields[builds]=version,processingState&limit=10")
              for b in builds["data"]:
                  ba = b["attributes"]
                  print(f"  build in group: version={ba.get('version')} state={ba.get('processingState')}")
              testers = api(f"/v1/betaGroups/{g['id']}/betaTesters?fields[betaTesters]=email,firstName&limit=10")
              for t in testers["data"]:
                  ta = t["attributes"]
                  print(f"  tester: {ta.get('firstName')} <{ta.get('email')}>")
          PYEOF
