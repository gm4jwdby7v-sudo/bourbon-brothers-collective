name: Check TestFlight Groups
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Manage TestFlight builds
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          BUNDLE_ID: app.bourbonconnect.mobile
        run: |
          set -euo pipefail
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$ASC_PRIVATE_KEY" > /tmp/AuthKey.p8
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 -d > /tmp/AuthKey.p8
          fi
          python3 -m pip install -q --break-system-packages pyjwt cryptography 2>&1 | tail -1 || true
          python3 - <<'PYEOF'
          import json, time, urllib.request, urllib.error, os
          import jwt
          kid = os.environ["ASC_KEY_ID"]; iss = os.environ["ASC_ISSUER_ID"]
          now = int(time.time())
          with open("/tmp/AuthKey.p8") as f: key = f.read()
          token = jwt.encode({"iss": iss, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          def api(path, method="GET", body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(f"https://api.appstoreconnect.apple.com{path}", data=data, method=method,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.load(r) if r.status != 204 else {}
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(errors="replace")
          bundle = os.environ["BUNDLE_ID"]
          _, apps = api(f"/v1/apps?filter[bundleId]={bundle}")
          aid = apps["data"][0]["id"]
          _, builds = api(f"/v1/builds?filter[app]={aid}&sort=-uploadedDate&limit=5&fields[builds]=version,processingState,usesNonExemptEncryption,uploadedDate")
          for b in builds["data"]:
              a = b["attributes"]
              print(f"Build {a.get('version')}: state={a.get('processingState')} encryption={a.get('usesNonExemptEncryption')}")
          latest = next(b for b in builds["data"] if b["attributes"].get("processingState") == "VALID")
          print(f"LATEST_VALID={latest['attributes']['version']}")
          # add latest valid build to external Family Testers group
          _, groups = api(f"/v1/apps/{aid}/relationships/betaGroups")
          ext_gid = None
          for g in groups["data"]:
              _, gd = api(f"/v1/betaGroups/{g['id']}")
              if gd["data"]["attributes"].get("isInternalGroup") is False:
                  ext_gid = g["id"]; print(f"External group: {gd['data']['attributes']['name']}")
          if ext_gid:
              s, _ = api(f"/v1/betaGroups/{ext_gid}/relationships/builds", method="POST",
                  body={"data": [{"type": "builds", "id": latest["id"]}]})
              print(f"Added build {latest['attributes']['version']} to external group: status={s}")
          print("Done.")
          PYEOF
