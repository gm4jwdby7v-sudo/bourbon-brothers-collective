name: Check TestFlight Groups
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Check beta review status
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          BUNDLE_ID: app.bourbonconnect.mobile
        run: |
          set -euo pipefail
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$ASC_PRIVATE_KEY" > /tmp/AuthKey.p8
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 -d > /tmp/AuthKey.p8
          fi
          python3 -m pip install -q --break-system-packages pyjwt cryptography 2>&1 | tail -1 || true
          python3 - <<'PYEOF'
          import json, time, urllib.request, urllib.error, os
          import jwt
          kid = os.environ["ASC_KEY_ID"]; iss = os.environ["ASC_ISSUER_ID"]
          now = int(time.time())
          with open("/tmp/AuthKey.p8") as f: key = f.read()
          token = jwt.encode({"iss": iss, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          def api(path, method="GET", body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(f"https://api.appstoreconnect.apple.com{path}", data=data, method=method,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.load(r) if r.status != 204 else {}
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(errors="replace")
          bundle = os.environ["BUNDLE_ID"]
          _, apps = api(f"/v1/apps?filter[bundleId]={bundle}")
          aid = apps["data"][0]["id"]
          # get builds for this app to map ids -> version numbers
          _, builds = api(f"/v1/builds?filter[app]={aid}&limit=10&fields[builds]=version")
          bmap = {b["id"]: b["attributes"].get("version") for b in builds["data"]}
          s, subs = api("/v1/betaAppReviewSubmissions?limit=20&include=build")
          if s != 200 or not isinstance(subs, dict):
              print(f"SUBMISSION_QUERY_FAILED status={s} body={str(subs)[:200]}")
          else:
              print(f"SUBMISSION_COUNT={len(subs['data'])}")
              for x in subs["data"]:
                  st = x["attributes"].get("betaReviewState")
                  bid = x["relationships"]["build"]["data"]["id"]
                  print(f"RESULT build={bmap.get(bid, bid)} state={st}")
          print("Done.")
          PYEOF
