name: Check TestFlight Groups
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Query beta groups and testers
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          BUNDLE_ID: app.bourbonconnect.mobile
        run: |
          set -euo pipefail
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$ASC_PRIVATE_KEY" > /tmp/AuthKey.p8
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 -d > /tmp/AuthKey.p8
          fi
          python3 -m pip install -q --break-system-packages pyjwt cryptography 2>&1 | tail -1 || true
          python3 - <<'PYEOF'
          import json, time, urllib.request, urllib.error, os
          import jwt
          kid = os.environ["ASC_KEY_ID"]; iss = os.environ["ASC_ISSUER_ID"]
          now = int(time.time())
          with open("/tmp/AuthKey.p8") as f:
              key = f.read()
          token = jwt.encode(
              {"iss": iss, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"},
          )
          def api(path: str):
              req = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com{path}",
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:500].decode(errors="replace")
          bundle = os.environ["BUNDLE_ID"]
          status, apps = api(f"/v1/apps?filter[bundleId]={bundle}")
          print(f"apps query: status={status}")
          if status != 200 or not apps.get("data"):
              print(f"body: {json.dumps(apps)[:800]}")
              raise SystemExit(1)
          app = apps["data"][0]
          aid = app["id"]
          print(f"App: {app['attributes'].get('name')} id={aid}")
          status, builds = api(f"/v1/builds?filter[app]={aid}&sort=-uploadedDate&limit=8&fields[builds]=version,uploadedDate,processingState,usesNonExemptEncryption")
          print(f"builds query: status={status}")
          for b in builds.get("data", []):
              a = b["attributes"]
              print(f"  build version={a.get('version')} uploaded={a.get('uploadedDate')} state={a.get('processingState')} encryption={a.get('usesNonExemptEncryption')}")
          status, groups = api(f"/v1/apps/{aid}/betaGroups?fields[betaGroups]=name,isInternalGroup,publicLinkEnabled,publicLink")
          print(f"groups query: status={status}")
          if status != 200:
              print(f"body: {json.dumps(groups)[:800]}")
          else:
              for g in groups.get("data", []):
                  ga = g["attributes"]
                  print(f"\nGroup: {ga.get('name')} internal={ga.get('isInternalGroup')} publicLinkEnabled={ga.get('publicLinkEnabled')}")
                  s2, gb = api(f"/v1/betaGroups/{g['id']}/builds?fields[builds]=version,processingState&limit=10")
                  for b in gb.get("data", []):
                      ba = b["attributes"]
                      print(f"  build in group: version={ba.get('version')} state={ba.get('processingState')}")
                  s3, testers = api(f"/v1/betaGroups/{g['id']}/betaTesters?fields[betaTesters]=email,firstName&limit=10")
                  if s3 == 200:
                      for t in testers.get("data", []):
                          ta = t["attributes"]
                          print(f"  tester: {ta.get('firstName')} <{ta.get('email')}>")
                  else:
                      print(f"  testers query failed: {s3}")
          PYEOF
